services:
  - type: web
    name: nane-catalog-api
    runtime: node
    plan: free
    region: virginia
    buildFilter:
      paths:
        - api/**
        - catalog-seed.json
    buildCommand: npm ci --prefix api
    startCommand: npm start --prefix api
    healthCheckPath: /health
    envVars:
      - key: GITHUB_OWNER
        value: kislhakk-ux
      - key: GITHUB_REPO
        value: SALGADOS
      - key: GITHUB_BRANCH
        value: main
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
