name: Build Agenda Nane APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase Android configuration
        id: firebase-config
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning file=android/app/google-services.json::Add the Firebase Android app config to build the APK. See README-RENDER.md."
          fi

      - name: Set up Java
        if: steps.firebase-config.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        if: steps.firebase-config.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Build installable APK
        if: steps.firebase-config.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: steps.firebase-config.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agenda-nane-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
